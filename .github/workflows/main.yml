name: Build Firmware

on:
  push:
    branches: [master]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug structure
        run: find . -name "platformio.ini" -o -name "*.ino" | head -20
      
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio
      
      - name: Go to dir
        run: cd ~/src/TrustMyBikeBoard/
      
      - name: Build firmware
        run:  pio run

      - name: Rename binary
        run: |
          cp .pio/build/heltec_wifi_lora_32_V3/firmware.bin firmware.bin
          # embed the commit SHA in the name for traceability
          echo "FW_FILE=firmware-${{ github.sha }}.bin" >> $GITHUB_ENV
          cp firmware.bin firmware-${{ github.sha }}.bin

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: Latest Firmware
          files: firmware-${{ github.sha }}.bin
          # always overwrite the 'firmware-latest' tag
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
