name: Build Firmware

on:
  push:
    branches: [master]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: src/TrustMyBikeBoard
        run:  pio run

      - name: Rename binary
        working-directory: src/TrustMyBikeBoard
        run: |
          cp .pio/build/heltec_wifi_lora_32_V3/firmware.bin $GITHUB_WORKSPACE/firmware-${{ github.sha }}.bin
          echo "FW_FILE=firmware-${{ github.sha }}.bin" >> $GITHUB_ENV

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: Latest Firmware
          files: firmware-${{ github.sha }}.bin
          # always overwrite the 'firmware-latest' tag
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
